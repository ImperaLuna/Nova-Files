# nova-files-entries
#
# The core side of the list on screen: reading a folder, ordering it,
# reading its details and icons a screenful at a time, and the per-client
# listing a newer one cancels. Features list through it and watch rows
# through the RowWatch port.
#
# Allowed outside crates: log
# Allowed workspace crates: nova-files-api, nova-files-disk

[package]
name = "nova-files-entries"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
nova-files-disk.workspace = true
