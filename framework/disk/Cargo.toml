# nova-files-disk
#
# The core side's own files on disk: private files saved whole, and the
# percent-encoding of paths in them.
#
# Allowed outside crates: rustix
# Allowed workspace crates: none

[package]
name = "nova-files-disk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Names the error for a chain of links too long to follow.
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
