# nova-files-disk
#
# The core side's own files on disk: private files saved whole, the
# percent-encoding of paths in them, the XDG home folders, watching and
# saving config files, and the ports to the icon theme and MIME database.
#
# Allowed outside crates:
# - log
# - rustix
#
# Allowed workspace crates:
# - nova-files-api

[package]
name = "nova-files-disk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
# Names the error for a chain of links too long to follow, watches config
# folders with inotify and reads mount roots with statx.
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "std"] }

[dev-dependencies]
nova-files-test-folder.workspace = true
