# nova-files-shell
#
# The window frame every feature's window half plugs into: parts and their
# slots, the host each part gets, folder rules, per-tab state and values
# one feature publishes for the others. It never touches the disk.
#
# Allowed outside crates:
# - chrono
# - futures
# - gpui
# - image
# - unicode-segmentation
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-messages

[package]
name = "nova-files-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
nova-files-api.workspace = true
nova-files-messages.workspace = true
unicode-segmentation = "1.13.3"
