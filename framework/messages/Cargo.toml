# nova-files-messages
#
# How the core and its clients talk: one connection per client, carrying
# each feature's own message types, the core's routes by type, and the
# loop that serves them until the core is idle or stopped.
#
# Allowed outside crates:
# - log
# Allowed workspace crates: none

[package]
name = "nova-files-messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Logs a message of a type its sink does not take.
log = { version = "0.4.35", features = ["std"] }
