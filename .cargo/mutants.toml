# cargo-mutants settings, read by `just mutants` and CI.
#
# Each exclusion is code no headless test can reach; everything else in the
# program is covered by crates/nova-files/tests/service.rs.
exclude_re = [
    # Open windows, so they need a display.
    "\\bshow_windows\\b",
    "nova-files-ui/src/lib\\.rs:.*\\brun\\b",
    # Window mode without a bus goes on to open a window.
    "replace match guard mode == Mode::Window with false in run",
    # Fires when the core stops, which takes the 3-minute idle wait.
    "\\bwatch_core\\b",
]
