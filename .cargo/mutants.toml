# cargo-mutants settings, read by `just mutants` and CI.
#
# Each exclusion is code no headless test can reach; everything else in the
# program is covered by crates/nova-files/tests/service.rs.

# Every mutant runs the whole workspace's tests: the window is tested from
# crates/nova-files/tests, not from its own crate.
test_workspace = true

exclude_re = [
    # Reads the real home folder and environment; `places_in` and
    # `config_home` hold the logic and are tested with temp folders.
    "nova-files-core/src/places\\.rs:.*replace places -> Vec<Place>",
    # Cancelling only saves a listing's remaining reads; no answer changes.
    "replace Client::cancel_listing with \\(\\)",
    # Dropping a client cancels its listing, for the same reason.
    "replace <impl Drop for Client>::drop with \\(\\)",
    # Open windows, so they need a display.
    "\\bshow_windows\\b",
    "nova-files-ui/src/lib\\.rs:.*\\brun\\b",
    # Window mode without a bus goes on to open a window.
    "replace match guard mode == Mode::Window with false in run",
    # Fires when the core stops, which takes the 3-minute idle wait.
    "\\bwatch_core\\b",
]
