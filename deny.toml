# cargo-deny: known vulnerabilities, licences, banned crates and sources.
#
# The per-crate allowed lists live at the top of each crate's Cargo.toml
# (tools/check-deps.sh); this file bans what no crate may use at all.

[graph]
all-features = true

[advisories]
# A yanked crate is a warning: it doesn't fail the build on its own.
yanked = "warn"
# Unmaintained only fails for crates we depend on directly; the ones deep in
# GPUI's and zbus's trees are theirs to replace. Vulnerabilities always fail.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "NCSA",
    # File-level copyleft: changes to those files stay open; our code doesn't.
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# No async runtime in our own code: threads and channels. That is held by
# each crate's allowed list (tools/check-deps.sh), not banned here, because
# GPUI's HTTP client pulls in tokio and that can't be switched off.
deny = [
    # libc 0.2.190 dropped ENOATTR, which xattr 0.2 (under GPUI's HTTP
    # client) still needs. Lift once GPUI moves to a newer xattr.
    { crate = "libc:>=0.2.190", reason = "xattr 0.2, used by GPUI, needs ENOATTR" },
    # Nova Files has its own fanotify/inotify watcher.
    { crate = "notify", reason = "use the core's own fanotify/inotify watcher" },
    # The index is a rebuildable cache file, not a database.
    { crate = "rusqlite", reason = "no database: the index is one mmapped file" },
    { crate = "sqlx", reason = "no database: the index is one mmapped file" },
    { crate = "sled", reason = "no database: the index is one mmapped file" },
    { crate = "redb", reason = "no database: the index is one mmapped file" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
