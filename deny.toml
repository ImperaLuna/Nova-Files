# cargo-deny: known vulnerabilities, licences, banned crates and sources.
#
# The per-crate allowed lists live at the top of each crate's Cargo.toml
# (tools/check-deps.sh); this file bans what no crate may use at all.

[graph]
all-features = true

[advisories]
# A yanked crate is a warning: it doesn't fail the build on its own.
yanked = "warn"
# Unmaintained only fails for crates we depend on directly; the ones deep in
# GPUI's and zbus's trees are theirs to replace. Vulnerabilities always fail.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "NCSA",
    # File-level copyleft: changes to those files stay open; our code doesn't.
    "MPL-2.0",
    # BSD-style licence of the Rust bzip2 port under GPUI's archive code.
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # No async runtime: threads and channels. GPUI's web backend pulls in
    # tokio and its HTTP client's tar code pulls in async-std; neither can be
    # switched off, so only those crates may depend on them.
    { crate = "tokio", reason = "threads and channels only, no async runtime", wrappers = [
        "wasm-bindgen-futures",
    ] },
    { crate = "async-std", reason = "threads and channels only, no async runtime", wrappers = [
        "async-tar",
    ] },
    # libc 0.2.190 dropped ENOATTR, which xattr 0.2 (under GPUI's HTTP
    # client) still needs. Lift once GPUI moves to a newer xattr.
    { crate = "libc:>=0.2.190", reason = "xattr 0.2, used by GPUI, needs ENOATTR" },
    # Nova Files has its own fanotify/inotify watcher.
    { crate = "notify", reason = "use the core's own fanotify/inotify watcher" },
    # The index is a rebuildable cache file, not a database.
    { crate = "rusqlite", reason = "no database: the index is one mmapped file" },
    { crate = "sqlx", reason = "no database: the index is one mmapped file" },
    { crate = "sled", reason = "no database: the index is one mmapped file" },
    { crate = "redb", reason = "no database: the index is one mmapped file" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # GPUI and its platform crates come from a fork of Zed (see Cargo.toml).
    "https://github.com/ImperaLuna/zed",
    # Zed's own forks and pins, which GPUI depends on by git.
    "https://github.com/zed-industries/wgpu.git",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/proptest-rs/proptest",
]
