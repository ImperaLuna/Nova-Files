# CI: the same `nix flake check` that runs locally, plus mutation tests on
# the lines a pull request changes.
#
# A new push cancels the run it replaces. Built Nix store paths come from
# Cachix when the CACHIX_AUTH_TOKEN secret is set, otherwise from the
# GitHub Actions cache, so a run only rebuilds what changed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs; every run on main finishes and fills the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # cache-nix-action deletes the caches it replaces.
  actions: write

env:
  CACHIX_CACHE: nova-files

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Free disk space
        # Runners have about 14 GB free; the Nix store needs more once GPUI lands.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        if: env.CACHIX_AUTH_TOKEN == ''
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --print-build-logs

  mutants:
    name: mutation tests on changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          # The whole history, so the diff against the base branch has a merge base.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        if: env.CACHIX_AUTH_TOKEN == ''
        with:
          primary-key: nix-mutants-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-mutants-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-mutants-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix develop --command just mutants origin/${{ github.base_ref }}
