# CI: the same `nix flake check` that runs locally, plus mutation tests on
# the lines a pull request changes.
#
# All three jobs are required checks, so they always run. The two long ones
# wait for the stack guard, then look at what the pull request changes
# (tools/ci-needs-run.sh) and, when nothing is there for them, report
# success in seconds without setting anything up.
#
# A new push cancels the run it replaces. Built Nix store paths come from
# Cachix when the CACHIX_AUTH_TOKEN secret is set, otherwise from the
# GitHub Actions cache, so a run only rebuilds what changed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs; every run on main finishes and fills the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # cache-nix-action deletes the caches it replaces.
  actions: write

env:
  CACHIX_CACHE: nova-de

jobs:
  # A stacked pull request (base isn't main) may change code only: docs,
  # agent rules, CI and tooling go in their own pull request off main
  # (tools/ci-stack-guard.sh has the list; tools/git-hooks/pre-push refuses
  # such a push before it gets here). It takes seconds, and the other jobs
  # wait for it, so a bad push never starts the long ones.
  stack-guard:
    name: stack holds code only
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        with:
          # The merge commit and its base parent, to diff against.
          fetch-depth: 2
      - name: Check the changed files
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --no-renames --name-only -z HEAD^1 HEAD | tools/ci-stack-guard.sh "$BASE"

  check:
    name: nix flake check
    needs: stack-guard
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its base parent, to see what changed.
          fetch-depth: 2
      - name: Look for changes to check
        id: changes
        run: tools/ci-needs-run.sh code
      - name: Free disk space in the background
        # The Nix store grows past the runner's free space only late in the
        # build, by when the deletion is done, so nothing waits for it.
        if: steps.changes.outputs.run == 'true'
        run: tools/ci-free-disk.sh start
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.run == 'true'
      - uses: cachix/cachix-action@v16
        if: steps.changes.outputs.run == 'true' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        if: steps.changes.outputs.run == 'true' && env.CACHIX_AUTH_TOKEN == ''
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check
        if: steps.changes.outputs.run == 'true'
        run: nix flake check --print-build-logs
      - name: Disk space left
        if: steps.changes.outputs.run == 'true'
        run: df -h /

  # On pull requests: mutation tests on the changed lines. On main: only a
  # build, to save the cargo cache. GitHub lets a PR restore caches saved on
  # main but not ones saved on other PR branches, so main keeps it warm.
  mutants:
    name: mutation tests on changed lines
    needs: stack-guard
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its base parent, to diff against.
          fetch-depth: 2
      - name: Look for Rust changes
        id: changes
        run: tools/ci-needs-run.sh rust
      - name: Free disk space in the background
        if: steps.changes.outputs.run == 'true'
        run: tools/ci-free-disk.sh start
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.run == 'true'
      - uses: cachix/cachix-action@v16
        if: steps.changes.outputs.run == 'true' && env.CACHIX_AUTH_TOKEN != ''
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - uses: nix-community/cache-nix-action@v6
        if: steps.changes.outputs.run == 'true' && env.CACHIX_AUTH_TOKEN == ''
        with:
          primary-key: nix-mutants-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-mutants-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-mutants-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Fetch the mutants dev shell
        # The slim shell from nix/mutants-shell.nix, not the full one.
        if: steps.changes.outputs.run == 'true'
        run: nix develop .#mutants --command true
      - name: Wait for the free disk space
        # The cargo cache and the copies of target/ need the room.
        if: steps.changes.outputs.run == 'true'
        run: tools/ci-free-disk.sh wait
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
      - name: Warm the cargo cache
        if: steps.changes.outputs.run == 'true' && github.event_name != 'pull_request'
        run: nix develop .#mutants --command cargo build --workspace --all-targets --profile ci
      - name: Mutation tests
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        # Two builds at once, not the local four: each copy of the tree needs
        # its own target/ folder, and the runner's disk can't hold four. Each
        # copy starts from the cached target/ folder. The `ci` profile (no
        # debug info) keeps those folders small and links each mutant fast.
        # --caught and --unviable print a line per mutant, so the log shows
        # progress instead of sitting silent until the end.
        env:
          CARGO_MUTANTS_JOBS: 2
        run: >-
          nix develop .#mutants --command just mutants HEAD^1 ""
          --profile ci --copy-target true --caught --unviable
