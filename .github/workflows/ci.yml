# CI: the same `nix flake check` that runs locally.
#
# Both jobs are required checks, so they always run. The check waits for
# the stack guard, then looks at what the pull request changes
# (tools/ci-needs-run.sh) and, when nothing is there for it, reports
# success in seconds without setting anything up.
#
# A new push cancels the run it replaces, and a failed check cancels the
# rest of its run. The Nix store comes from the GitHub Actions cache,
# saved by runs on main, so a run only rebuilds what changed. Cachix
# holds only what a PC downloads (release-build.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs; every run on main finishes and fills the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # cache-nix-action deletes the caches it replaces, and "Stop the rest
  # of the run" cancels the run.
  actions: write

jobs:
  # A stacked pull request (base isn't main) may change code only: docs,
  # agent rules, CI and tooling go in their own pull request off main
  # (tools/ci-stack-guard.sh has the list; tools/git-hooks/pre-push refuses
  # such a push before it gets here). It takes seconds, and the other jobs
  # wait for it, so a bad push never starts the long one.
  stack-guard:
    name: stack holds code only
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        with:
          # The merge commit and its base parent, to diff against.
          fetch-depth: 2
      - name: Check the changed files
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        env:
          BASE: ${{ github.base_ref }}
        # Files the branch got by merging main are let through, so main is
        # fetched to compare against.
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --no-renames --name-only -z HEAD^1 HEAD | tools/ci-stack-guard.sh "$BASE" FETCH_HEAD HEAD

  check:
    name: nix flake check
    needs: stack-guard
    runs-on: ubuntu-latest
    # A normal run takes 2 to 17 minutes; a hung one stops here.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its base parent, to see what changed.
          fetch-depth: 2
      - name: Look for changes to check
        id: changes
        run: tools/ci-needs-run.sh code
      - name: Free disk space in the background
        # The Nix store grows past the runner's free space only late in the
        # build, by when the deletion is done, so nothing waits for it.
        if: steps.changes.outputs.run == 'true'
        run: tools/ci-free-disk.sh start
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.run == 'true'
      - uses: nix-community/cache-nix-action@v6
        if: steps.changes.outputs.run == 'true'
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          # Only main saves: a pull request's cache is visible to that pull
          # request alone, and the repository holds 10 GB in all.
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check
        if: steps.changes.outputs.run == 'true'
        run: nix flake check --print-build-logs
      - name: Disk space left
        if: steps.changes.outputs.run == 'true'
        run: df -h /
      - name: Stop the rest of the run
        # One failed check already fails the pull request, so the rest of
        # the run would only burn minutes. Cancelling the run stops it.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
