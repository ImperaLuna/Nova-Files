# nova-files-thumbnailer
#
# The sandboxed thumbnail helper. It renders one batch of thumbnails, then
# exits.
#
# Allowed outside crates:
# - image
# - landlock
# - resvg
# - rustix
# Allowed workspace crates: none

[package]
name = "nova-files-thumbnailer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Only the formats the helper decodes itself; the rest go to the system's
# thumbnailers. GPUI already builds image with more formats.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
landlock = "0.4"
# Draws SVG drawings at the quick look's size. GPUI already builds it.
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Waits on the system thumbnailer itself, with a deadline (pidfd).
rustix = { version = "1.1.6", default-features = false, features = ["event", "process", "std"] }

[dev-dependencies]
nova-files-test-folder.workspace = true
# The tests run the helper the way the core does, and a window on top.
gpui = { workspace = true, features = ["test-support"] }
nova-files-api.workspace = true
nova-files.workspace = true
nova-files-preview-api.workspace = true
nova-files-preview-ui.workspace = true
nova-files-shell.workspace = true
nova-files-thumbnails-api.workspace = true
nova-files-thumbnails-ui.workspace = true
nova-files-window.workspace = true
