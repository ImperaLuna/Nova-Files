# nova-files-ui
#
# The window. It sends commands to the core and draws from its events; it
# never touches the disk.
#
# Allowed outside crates:
# - chrono
# - futures
# - gpui
# - gpui-component
# - gpui_platform
# - image
# - log
# - unicode-segmentation
# - usvg
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-clipboard-api
# - nova-files-folders-api
# - nova-files-picker-api
# - nova-files-settings-api
# - nova-files-shell
# - nova-files-trash-api

[package]
name = "nova-files-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Local time for the Modified column; GPUI already builds it.
chrono = "0.4.45"
nova-files-api.workspace = true
nova-files-clipboard-api.workspace = true
nova-files-folders-api.workspace = true
nova-files-picker-api.workspace = true
nova-files-settings-api.workspace = true
nova-files-shell.workspace = true
nova-files-trash-api.workspace = true
# Logs an event no part takes.
log = { version = "0.4.35", features = ["std"] }
# Async channels, so events from other threads wake the window's tasks.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
gpui.workspace = true
gpui_platform.workspace = true
# Shrinks thumbnails to the size they're drawn; GPUI already builds it.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Grapheme boundaries, so the caret steps over a whole character; GPUI
# already builds it.
unicode-segmentation = "1.13.3"
# Reads a theme icon's own size, so GPUI's SVG renderer draws it straight
# at the row's size; GPUI already builds it.
usvg = { version = "0.45.1", default-features = false }
