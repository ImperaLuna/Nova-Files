# nova-files-core
#
# The core. Index, search, folder listing, watching, jobs and settings. It
# never draws anything.
#
# Allowed outside crates:
# - chrono
# - log
# - rustix
# - serde
# - serde_json
# - toml
# - toml_edit
# - uzers
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-clipboard-api
# - nova-files-disk
# - nova-files-entries
# - nova-files-index
# - nova-files-jobs
# - nova-files-messages
# - nova-files-open-api
# - nova-files-open-core
# - nova-files-rename-api
# - nova-files-rename-core
# - nova-files-settings-api
# - nova-files-settings-core
# - nova-files-thumbnailer-launch
# - nova-files-trash-api
# - nova-files-trash-core

[package]
name = "nova-files-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The trash spec's DeletionDate is local time: the system time zone.
chrono = "0.4.45"
# Kills the thumbnail helper's process group when a batch runs out of time,
# reads the monotonic clock for the frame trace, renames without replacing
# for file operations, and watches the config folder (inotify, woken
# through an eventfd).
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "process", "std", "time"] }
# Receives GPUI's start-up phases and frame times for the traces; GPUI already builds it.
log = { version = "0.4.35", features = ["std"] }
# Read the library path out of Vulkan driver manifests (vulkan_drivers.rs).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Reads the settings file and edits it in place, keeping the user's
# comments; already in the lock through zbus's macros.
toml_edit = { version = "0.25.18", default-features = false, features = ["display", "parse"] }
# Names the owner and group of a file, and the groups the user is in, the
# way the system does (NSS: LDAP, systemd-homed and the like as well as
# /etc/passwd). The standard library and rustix have no such lookup.
uzers = { version = "0.12.2", default-features = false }
nova-files-api.workspace = true
nova-files-disk.workspace = true
nova-files-entries.workspace = true
nova-files-index.workspace = true
nova-files-jobs.workspace = true
nova-files-messages.workspace = true
nova-files-open-api.workspace = true
nova-files-open-core.workspace = true
nova-files-rename-api.workspace = true
nova-files-rename-core.workspace = true
nova-files-settings-api.workspace = true
nova-files-settings-core.workspace = true
nova-files-thumbnailer-launch.workspace = true
nova-files-trash-api.workspace = true
nova-files-trash-core.workspace = true

[dev-dependencies]
nova-files-clipboard-api.workspace = true
nova-files-jobs = { workspace = true, features = ["test-support"] }
nova-files-picker-api.workspace = true
# Gives a test's own thread other groups (accounts tests).
rustix = { version = "1.1.6", default-features = false, features = ["thread"] }
