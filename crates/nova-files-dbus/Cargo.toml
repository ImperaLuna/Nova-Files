# nova-files-dbus
#
# The public D-Bus interface that launchers and shells use to search and open
# files.
#
# Allowed outside crates: futures, zbus
# Allowed workspace crates: nova-files-api

[package]
name = "nova-files-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# A one-shot channel, so a D-Bus call can await an answer from a thread.
futures = { version = "0.3", default-features = false, features = ["std"] }
nova-files-api.workspace = true
zbus = "5"

[dev-dependencies]
nova-files-core.workspace = true
