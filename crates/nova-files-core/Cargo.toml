# nova-files-core
#
# The core. Index, search, folder listing, watching, jobs and settings. It
# never draws anything.
#
# Allowed outside crates: log, rustix, serde, serde_json, toml, toml_edit, uzers
# Allowed workspace crates: nova-files-api, nova-files-index

[package]
name = "nova-files-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Kills the thumbnail helper's process group when a batch runs out of time,
# reads the monotonic clock for the frame trace, renames without replacing
# for file operations, and watches the config folder (inotify, woken
# through an eventfd).
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "process", "std", "time"] }
# Receives GPUI's start-up phases and frame times for the traces; GPUI already builds it.
log = { version = "0.4.35", features = ["std"] }
# Read the library path out of Vulkan driver manifests (vulkan_drivers.rs).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Reads the settings file and edits it in place, keeping the user's
# comments; already in the lock through zbus's macros.
toml_edit = { version = "0.25.18", default-features = false, features = ["display", "parse"] }
# Names the owner and group of a file, and the groups the user is in, the
# way the system does (NSS: LDAP, systemd-homed and the like as well as
# /etc/passwd). The standard library and rustix have no such lookup.
uzers = { version = "0.12.2", default-features = false }
nova-files-api.workspace = true
nova-files-index.workspace = true

[dev-dependencies]
# Gives a test's own thread other groups (accounts tests).
rustix = { version = "1.1.6", default-features = false, features = ["thread"] }
