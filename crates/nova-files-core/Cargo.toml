# nova-files-core
#
# The core. Index, search, folder listing, watching, jobs and settings. It
# never draws anything.
#
# Allowed outside crates: log, rustix, serde, serde_json, toml
# Allowed workspace crates: nova-files-api, nova-files-index

[package]
name = "nova-files-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Kills the thumbnail helper's process group when a batch runs out of time,
# and reads the monotonic clock for the frame trace.
rustix = { version = "1.1.6", default-features = false, features = ["process", "std", "time"] }
# Receives GPUI's start-up phases and frame times for the traces; GPUI already builds it.
log = { version = "0.4.35", features = ["std"] }
# Read the library path out of Vulkan driver manifests (vulkan_drivers.rs).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
nova-files-api.workspace = true
