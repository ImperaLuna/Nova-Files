# nova-files-core
#
# The core. Index, search, folder listing, watching, jobs and settings. It
# never draws anything.
#
# Allowed outside crates: rustix, serde, toml
# Allowed workspace crates: nova-files-api, nova-files-index

[package]
name = "nova-files-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Kills the thumbnail helper's process group when a batch runs out of time.
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
nova-files-api.workspace = true
