# nova-files-thumbnailer
#
# The sandboxed thumbnail helper. It renders one batch of thumbnails, then
# exits.
#
# Allowed outside crates: image, landlock
# Allowed workspace crates: none

[package]
name = "nova-files-thumbnailer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Only the formats the helper decodes itself; the rest go to the system's
# thumbnailers. GPUI already builds image with more formats.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
landlock = "0.4"

[dev-dependencies]
# The tests run the helper the way the core does.
nova-files-api.workspace = true
nova-files-core.workspace = true
