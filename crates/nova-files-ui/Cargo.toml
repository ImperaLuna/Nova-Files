# nova-files-ui
#
# The window. It sends commands to the core and draws from its events; it
# never touches the disk.
#
# Allowed outside crates: futures, gpui, gpui-component
# Allowed workspace crates: nova-files-api

[package]
name = "nova-files-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nova-files-api.workspace = true
# An async channel, so events from the core's thread wake the window's task.
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui = "0.2.2"
