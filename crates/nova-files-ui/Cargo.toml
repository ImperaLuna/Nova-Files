# nova-files-ui
#
# The window. It sends commands to the core and draws from its events; it
# never touches the disk.
#
# Allowed outside crates: chrono, futures, gpui, gpui-component, gpui_platform, image, unicode-segmentation
# Allowed workspace crates: nova-files-api

[package]
name = "nova-files-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Local time for the Modified column; GPUI already builds it.
chrono = "0.4.45"
nova-files-api.workspace = true
# Async channels, so events from other threads wake the window's tasks.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
gpui.workspace = true
gpui_platform.workspace = true
# Shrinks thumbnails to the size they're drawn; GPUI already builds it.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Grapheme boundaries, so the caret steps over a whole character; GPUI
# already builds it.
unicode-segmentation = "1.13.3"
