# nova-files-index
#
# The file index: one memory-mapped file of names and metadata, plus its
# change log.
#
# Allowed outside crates: memmap2, rustix
# Allowed workspace crates: none

[package]
name = "nova-files-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Maps the index file, so reading it costs no copy and only the pages a
# search touches.
memmap2 = "0.9.12"
# statx, to tell a mount point from a btrfs subvolume (mounts.rs).
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
