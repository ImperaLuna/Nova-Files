# nova-files-thumbnails-ui
#
# Thumbnails' window half: keeps the thumbnails of the rows on screen,
# shrunk to the side the window draws them at, and draws them as row icons.
#
# Allowed outside crates:
# - gpui
# - image
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-shell
# - nova-files-thumbnails-api

[package]
name = "nova-files-thumbnails-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
gpui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
nova-files-api.workspace = true
nova-files-shell.workspace = true
nova-files-thumbnails-api.workspace = true
