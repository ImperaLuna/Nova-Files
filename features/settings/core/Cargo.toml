# nova-files-settings-core
#
# The settings feature's core half: reads the settings file, saves each
# change in place, and tells every client that asked when one changes.
#
# Allowed outside crates:
# - log
# - toml_edit
# Allowed workspace crates:
# - nova-files-api
# - nova-files-disk
# - nova-files-messages
# - nova-files-settings-api

[package]
name = "nova-files-settings-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
# Reads the settings file and edits it in place, keeping the user's
# comments; already in the lock through zbus's macros.
toml_edit = { version = "0.25.18", default-features = false, features = ["display", "parse"] }
nova-files-api.workspace = true
nova-files-disk.workspace = true
nova-files-messages.workspace = true
nova-files-settings-api.workspace = true

[dev-dependencies]
nova-files-test-folder.workspace = true
