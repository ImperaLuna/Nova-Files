# nova-files-delete-core
#
# Deletes files and folders for good, deepest first.
#
# Allowed outside crates:
# - log
# - rustix
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-jobs

[package]
name = "nova-files-delete-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Removes each entry by name inside its open folder.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
nova-files-jobs.workspace = true

[dev-dependencies]
nova-files-jobs = { workspace = true, features = ["test-support"] }
nova-files-test-folder.workspace = true
