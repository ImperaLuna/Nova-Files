# nova-files-git-core
#
# The git feature's core half: reads each asked folder's repository state
# with the system's git program, one folder after another, in the
# background, and reads a folder again when its repository changes.
#
# Allowed outside crates:
# - log
# - rustix
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-git-api

[package]
name = "nova-files-git-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "std"] }
nova-files-api.workspace = true
nova-files-git-api.workspace = true

[dev-dependencies]
nova-files-test-folder.workspace = true
