# nova-files-git-ui
#
# The git feature's window half: a letter at the end of each changed or
# new row in a folder inside a git repository, and ignored rows dimmed.
#
# Allowed outside crates:
# - gpui
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-git-api
# - nova-files-shell

[package]
name = "nova-files-git-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
gpui.workspace = true
nova-files-api.workspace = true
nova-files-git-api.workspace = true
nova-files-shell.workspace = true
