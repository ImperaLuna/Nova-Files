# nova-files-picker-ui
#
# The picker's window half: what a pick request asks the window to show,
# from its title and button to the file types it offers.
#
# Allowed outside crates:
# - futures
# - gpui
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-picker-api
# - nova-files-properties-api
# - nova-files-shell

[package]
name = "nova-files-picker-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Carries the answer of a folder pick back to the window's thread.
futures = { version = "0.3", default-features = false, features = ["std"] }
gpui.workspace = true
nova-files-api.workspace = true
nova-files-picker-api.workspace = true
nova-files-properties-api.workspace = true
nova-files-shell.workspace = true
