# nova-files-preview-core
#
# The preview feature's core half: looks into a file or folder for a quick
# look, reading a text file's start, a folder's first entries, or a
# picture through the thumbnail helper.
#
# Allowed outside crates:
# - pulldown-cmark
# - rustix
# - syntect
# - two-face
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-disk
# - nova-files-entries-core
# - nova-files-preview-api
# - nova-files-thumbnailer-launch

[package]
name = "nova-files-preview-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Reads a Markdown file into headings, lists, tables and the rest.
pulldown-cmark = { version = "0.13.0", default-features = false }
# Opens a file without blocking on a pipe or device.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
# Marks a source file's keywords, strings and comments for its colours.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
# More grammars for syntect (TOML, Nix, TypeScript and others), from bat.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
nova-files-api.workspace = true
nova-files-disk.workspace = true
nova-files-entries-core.workspace = true
nova-files-preview-api.workspace = true
nova-files-thumbnailer-launch.workspace = true

[dev-dependencies]
nova-files-test-folder.workspace = true
