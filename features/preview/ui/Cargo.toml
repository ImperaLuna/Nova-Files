# nova-files-preview-ui
#
# Preview's window half: the quick look over the window, and the picture the
# gallery shows on its stage.
#
# Allowed outside crates:
# - gpui
# - image
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-preview-api
# - nova-files-shell

[package]
name = "nova-files-preview-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
gpui.workspace = true
image = { version = "0.25.10", default-features = false }
nova-files-api.workspace = true
nova-files-preview-api.workspace = true
nova-files-shell.workspace = true
