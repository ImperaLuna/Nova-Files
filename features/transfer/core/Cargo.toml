# nova-files-transfer-core
#
# Copies and moves files and folders: planning, copying each file, making
# each entry, keeping both names, and copying attributes.
#
# Allowed outside crates:
# - log
# - rustix
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-jobs

[package]
name = "nova-files-transfer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Clones, copies ranges, opens folders by handle and reads extended attributes.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
nova-files-jobs.workspace = true

[dev-dependencies]
nova-files-jobs = { workspace = true, features = ["test-support"] }
