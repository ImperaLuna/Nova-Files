# nova-files-start-core
#
# The Start page's core half: remembers the folders a person opened lately
# between runs, and answers with the ones that can still be read, each with
# a peek at its first entries.
#
# Allowed outside crates:
# - log
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-disk
# - nova-files-entries-core
# - nova-files-messages
# - nova-files-start-api

[package]
name = "nova-files-start-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
nova-files-disk.workspace = true
nova-files-entries-core.workspace = true
nova-files-messages.workspace = true
nova-files-start-api.workspace = true
