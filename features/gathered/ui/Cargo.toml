# nova-files-gathered-ui
#
# The gathered feature's window half: the Games and Projects pages and
# their rows in the sidebar, the Library column, the chip that lists and
# removes their folders, adding a folder by picking or dropping it, and
# the notes that undo it.
#
# Allowed outside crates:
# - gpui
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-gathered-api
# - nova-files-shell

[package]
name = "nova-files-gathered-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
gpui.workspace = true
nova-files-api.workspace = true
nova-files-gathered-api.workspace = true
nova-files-shell.workspace = true
