# nova-files-open-core
#
# The open feature's core half: reads the MIME database and the desktop's
# app lists, opens files in their default app, answers Open With and makes
# an app the default for a type or for folders.
#
# Allowed outside crates:
# - log
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-disk
# - nova-files-open-api

[package]
name = "nova-files-open-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
log = { version = "0.4.35", features = ["std"] }
nova-files-api.workspace = true
nova-files-disk.workspace = true
nova-files-open-api.workspace = true

[dev-dependencies]
nova-files-test-folder.workspace = true
nova-files-picker-api.workspace = true
