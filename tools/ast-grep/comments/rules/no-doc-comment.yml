id: no-doc-comment
language: rust
severity: error
message: >-
  Doc comment outside nova-files-api. Delete it. Name the item so it says
  what it does; a promise the item makes becomes a type or a test.
note: >-
  Only the docs of nova-files-api, the public contract other apps build
  on, are kept, plus a doc line that links the outside source of a fact
  (`https://`).
files:
  - "**/*.rs"
ignores:
  - "framework/base/**"
utils:
  linked: { kind: line_comment, regex: 'https?://' }
  run-break: { not: { kind: line_comment } }
rule:
  regex: '^(///($|[^/])|//!|/\*\*[^*/]|/\*!)'
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    any:
      - regex: 'https?://'
      - follows: { matches: linked, stopBy: { matches: run-break } }
      - precedes: { matches: linked, stopBy: { matches: run-break } }
