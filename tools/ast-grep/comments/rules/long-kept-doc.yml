id: long-kept-doc
language: rust
severity: error
message: >-
  A kept comment runs past two lines. Cut the fact to one or two plain
  lines and its source link; anything more belongs in the code, a test or
  the PR.
note: >-
  The docs of nova-files-api and the features' api crates, the contract
  other apps and features build on, have no cap.
files:
  - "**/*.rs"
ignores:
  - "framework/base/**"
  - "features/*/api/**"
rule:
  kind: line_comment
  regex: '^(///($|[^/])|//!)'
  follows:
    kind: line_comment
    follows: { kind: line_comment }
