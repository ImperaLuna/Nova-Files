# Test code in a `#[cfg(test)]` module or a `#[test]` function; files of
# tests (tests/, tests.rs) are covered by no-raw-temp-dir.
# A folder made straight in the temp folder is named by hand, clashes when
# two tests pick the same name, and stays behind when a test fails before
# its clean-up. TestFolder names each one per test and removes it on drop.
id: no-raw-temp-dir-in-module
language: rust
severity: error
message: Make the folder with nova_files_test_folder::TestFolder, which names it per test and removes it.
files:
  - "app/**/*.rs"
  - "framework/**/*.rs"
  - "features/**/*.rs"
  - "fronts/**/*.rs"
  - "helpers/**/*.rs"
ignores:
  - "framework/test-folder/**"
rule:
  pattern: $TEMP.join($$$NAME)
  has:
    field: function
    has:
      field: value
      kind: call_expression
      has:
        field: function
        regex: '(^|::)temp_dir$'
  inside:
    stopBy: end
    any:
      - kind: mod_item
        follows: { kind: attribute_item, regex: 'cfg\(test\)' }
      - kind: function_item
        follows: { kind: attribute_item, regex: 'test\]$' }
