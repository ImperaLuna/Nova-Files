# The Nova Files Cargo workspace: crates in layered folders (see AGENTS.md
# "Layout"), one lint policy.
#
# Each crate's Cargo.toml opens with the outside and workspace crates it may
# depend on; `tools/check-deps.sh` holds every crate to its list. Adding an
# outside crate means editing that list in a reviewed PR that says why.

[workspace]
resolver = "3"
members = ["app", "features/*/*", "framework/base", "framework/disk", "framework/entries/*", "framework/jobs", "framework/messages", "framework/shell", "fronts/*", "helpers/*", "legacy/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ImperaLuna/Nova-Files"
publish = false

[workspace.dependencies]
nova-files-api = { path = "framework/base" }
nova-files-archives-core = { path = "features/archives/core" }
nova-files-clipboard-api = { path = "features/clipboard/api" }
nova-files-clipboard-ui = { path = "features/clipboard/ui" }
nova-files-core = { path = "legacy/core" }
nova-files-dbus = { path = "fronts/dbus" }
nova-files-delete-core = { path = "features/delete/core" }
nova-files-delete-ui = { path = "features/delete/ui" }
nova-files-disk = { path = "framework/disk" }
nova-files-drives-api = { path = "features/drives/api" }
