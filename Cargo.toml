# The Nova Files Cargo workspace: seven crates, one lint policy.
#
# Each crate's Cargo.toml opens with the outside and workspace crates it may
# depend on; `tools/check-deps.sh` holds every crate to its list. Adding an
# outside crate means editing that list in a reviewed PR that says why.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ImperaLuna/Nova-Files"
publish = false

[workspace.dependencies]
nova-files-api = { path = "crates/nova-files-api" }
nova-files-core = { path = "crates/nova-files-core" }
nova-files-dbus = { path = "crates/nova-files-dbus" }
nova-files-index = { path = "crates/nova-files-index" }
nova-files-ui = { path = "crates/nova-files-ui" }

# GPUI comes from Zed's repo through ImperaLuna/zed, a fork that adds fixes
# on top of a Zed stable release (FIL-42, FIL-44, FIL-65, FIL-68, FIL-71, FIL-70,
# FIL-78). Each pin is its own branch, `nova/<tag>` (with a suffix when fixes
# are added to a pin), so older pins stay buildable:
# - zed-industries/zed#63289: make the path (MSAA) textures only when a frame
#   draws a path.
# - zed-industries/zed#65755: load OpenGL only when hardware Vulkan fails.
# - FIL-65: build the GPU pipelines on a window's first frame, once it has
#   settled on opaque or transparent, instead of twice per window.
# - FIL-65: load the system fonts on a background thread, so reading them
#   overlaps the GPU setup instead of coming before it.
# - FIL-68: log the start-up phases (target `gpui::startup`) for the
#   start-up trace.
# - FIL-71: take GPU memory in fixed 4 MiB blocks instead of blocks that
#   grow from 8 MiB, so the first image atlas doesn't pull in 16 MiB.
# - FIL-70: log each drawn frame's duration (target `gpui::frame`) for the
#   frame trace.
# - FIL-70: remember what each font resolved to, so a missing font (the
#   default one, on most Linux systems) doesn't walk the fallback stack on
#   every text run of every frame.
# - FIL-78: read fonts through fontconfig only when text needs them (the UI
#   font at start, others on first use), instead of every system font.
# When all are merged upstream, point these back at zed-industries/zed.
#
# The crates.io release (0.2.2) draws through blade, which turns on ray
# tracing and makes NVIDIA's driver load CUDA. `version` picks Zed's real
# gpui: the repo also holds a test fixture crate named gpui. Move both pins
# together.
gpui = { git = "https://github.com/ImperaLuna/zed", rev = "1059616cf68a8ef2062875eced54e7c3be94d41b", version = "0.2.2" }
# The platform half of GPUI (windows, input, the renderer). Wayland and X11
# are off by default; without them the app runs but never opens a window.
gpui_platform = { git = "https://github.com/ImperaLuna/zed", rev = "1059616cf68a8ef2062875eced54e7c3be94d41b", features = ["wayland", "x11"] }

[workspace.lints.rust]
# Denied, not forbidden, so nova-files-index and the nova-files binary (one
# environment variable set before any thread starts) can opt in per site with
# `#[expect(unsafe_code, reason = "...")]`. Every other crate root forbids it.
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Pedantic lints that cost more noise than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Restriction picks. clippy.toml exempts tests where noted there.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
excessive_nesting = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Checks and mutation tests in CI. The release profile's LTO makes every
# test binary link for minutes, and debug info swells target/ and the link,
# so CI builds the code like dev but without either.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

