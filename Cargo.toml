# The Nova Files Cargo workspace: seven crates, one lint policy.
#
# Each crate's Cargo.toml opens with the outside and workspace crates it may
# depend on; `tools/check-deps.sh` holds every crate to its list. Adding an
# outside crate means editing that list in a reviewed PR that says why.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ImperaLuna/Nova-Files"
publish = false

[workspace.dependencies]
nova-files-api = { path = "crates/nova-files-api" }
nova-files-core = { path = "crates/nova-files-core" }
nova-files-dbus = { path = "crates/nova-files-dbus" }
nova-files-index = { path = "crates/nova-files-index" }
nova-files-ui = { path = "crates/nova-files-ui" }

# GPUI comes from Zed's repo through ImperaLuna/zed, a fork that adds two
# memory fixes on top of a Zed stable release (FIL-42, FIL-44). Each pin is
# its own branch, `nova/<tag>`, so older pins stay buildable:
# - zed-industries/zed#63289: make the path (MSAA) textures only when a frame
#   draws a path.
# - zed-industries/zed#65755: load OpenGL only when hardware Vulkan fails.
# When both are merged upstream, point these back at zed-industries/zed.
#
# The crates.io release (0.2.2) draws through blade, which turns on ray
# tracing and makes NVIDIA's driver load CUDA. `version` picks Zed's real
# gpui: the repo also holds a test fixture crate named gpui. Move both pins
# together.
gpui = { git = "https://github.com/ImperaLuna/zed", rev = "814a9d4aaa56b6e332840817a0116d61087fd94a", version = "0.2.2" }
# The platform half of GPUI (windows, input, the renderer). Wayland and X11
# are off by default; without them the app runs but never opens a window.
gpui_platform = { git = "https://github.com/ImperaLuna/zed", rev = "814a9d4aaa56b6e332840817a0116d61087fd94a", features = ["wayland", "x11"] }

[workspace.lints.rust]
# Denied, not forbidden, so nova-files-index can opt in per site with
# `#[expect(unsafe_code, reason = "...")]`. Every other crate root forbids it.
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Pedantic lints that cost more noise than they catch.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Restriction picks. clippy.toml exempts tests where noted there.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
excessive_nesting = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

