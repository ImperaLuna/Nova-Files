# nova-files
#
# The program. Wiring only: it starts the core, the D-Bus service and the
# window, and holds no logic of its own.
#
# Allowed outside crates:
# - libc
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-clipboard-ui
# - nova-files-core
# - nova-files-dbus
# - nova-files-delete-ui
# - nova-files-drives-api
# - nova-files-drives-ui
# - nova-files-index
# - nova-files-look-ui
# - nova-files-open-ui
# - nova-files-picker-api
# - nova-files-picker-ui
# - nova-files-places-ui
# - nova-files-rename-ui
# - nova-files-settings-ui
# - nova-files-shell
# - nova-files-thumbnails-ui
# - nova-files-transfer-ui
# - nova-files-trash-ui
# - nova-files-ui

[package]
name = "nova-files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# malloc_trim, to give freed memory back after a listing (memory.rs).
libc = "0.2.189"
nova-files-api.workspace = true
nova-files-clipboard-ui.workspace = true
nova-files-core.workspace = true
nova-files-dbus.workspace = true
nova-files-delete-ui.workspace = true
nova-files-drives-api.workspace = true
nova-files-drives-ui.workspace = true
nova-files-look-ui.workspace = true
nova-files-open-ui.workspace = true
nova-files-picker-api.workspace = true
nova-files-picker-ui.workspace = true
nova-files-places-ui.workspace = true
nova-files-rename-ui.workspace = true
nova-files-settings-ui.workspace = true
nova-files-shell.workspace = true
nova-files-thumbnails-ui.workspace = true
nova-files-transfer-ui.workspace = true
nova-files-trash-ui.workspace = true
nova-files-ui.workspace = true

[dev-dependencies]
nova-files-folders-api.workspace = true
nova-files-gathered-api.workspace = true
nova-files-look-api.workspace = true
nova-files-open-api.workspace = true
nova-files-places-api.workspace = true
nova-files-preview-api.workspace = true
nova-files-properties-api.workspace = true
nova-files-search-api.workspace = true
nova-files-settings-api.workspace = true
nova-files-start-api.workspace = true
nova-files-thumbnails-api.workspace = true
nova-files-trash-api.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# To call the running program over D-Bus, as a launcher would.
zbus = "5"
