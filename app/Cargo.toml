# nova-files
#
# The program. Wiring only: it starts the core, the D-Bus service and the
# window, and holds no logic of its own.
#
# Allowed outside crates:
# - libc
# - log
# - rustix
# - serde
# - serde_json
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-archives-core
# - nova-files-clipboard-api
# - nova-files-clipboard-ui
# - nova-files-dbus
# - nova-files-delete-core
# - nova-files-delete-ui
# - nova-files-disk
# - nova-files-drives-api
# - nova-files-drives-core
# - nova-files-drives-ui
# - nova-files-entries-core
# - nova-files-folders-api
# - nova-files-folders-core
# - nova-files-folders-ui
# - nova-files-gathered-api
# - nova-files-gathered-core
# - nova-files-gathered-ui
# - nova-files-index
# - nova-files-jobs
# - nova-files-look-api
# - nova-files-look-core
# - nova-files-look-ui
# - nova-files-messages
# - nova-files-open-api
# - nova-files-open-core
# - nova-files-open-ui
# - nova-files-picker-api
# - nova-files-picker-ui
# - nova-files-places-api
# - nova-files-places-core
# - nova-files-places-ui
# - nova-files-preview-api
# - nova-files-preview-core
# - nova-files-preview-ui
# - nova-files-properties-api
# - nova-files-properties-core
# - nova-files-properties-ui
# - nova-files-rename-core
# - nova-files-rename-ui
# - nova-files-search-api
# - nova-files-search-core
# - nova-files-search-ui
# - nova-files-settings-api
# - nova-files-settings-core
# - nova-files-settings-ui
# - nova-files-shell
# - nova-files-start-api
# - nova-files-start-core
# - nova-files-start-ui
# - nova-files-thumbnails-api
# - nova-files-thumbnails-core
# - nova-files-thumbnails-ui
# - nova-files-transfer-api
# - nova-files-transfer-core
# - nova-files-transfer-ui
# - nova-files-trash-api
# - nova-files-trash-core
# - nova-files-trash-ui
# - nova-files-ui
# - nova-files-undo-ui

[package]
name = "nova-files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# malloc_trim, to give freed memory back after a listing (memory.rs).
libc = "0.2.189"
# Receives GPUI's start-up phases and frame times for the traces; GPUI already builds it.
log = { version = "0.4.35", features = ["std"] }
# Reads the monotonic clock for the frame trace; the core tests also hold a
# job journal's lock the way another core would (tests/core/resume.rs).
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std", "time"] }
# Read the library path out of Vulkan driver manifests (vulkan_drivers.rs).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
nova-files-api.workspace = true
nova-files-archives-core.workspace = true
nova-files-clipboard-ui.workspace = true
nova-files-dbus.workspace = true
nova-files-delete-core.workspace = true
nova-files-delete-ui.workspace = true
nova-files-disk.workspace = true
nova-files-drives-api.workspace = true
nova-files-drives-core.workspace = true
nova-files-drives-ui.workspace = true
nova-files-entries-core.workspace = true
nova-files-folders-api.workspace = true
nova-files-folders-core.workspace = true
nova-files-folders-ui.workspace = true
nova-files-gathered-api.workspace = true
nova-files-gathered-core.workspace = true
nova-files-gathered-ui.workspace = true
nova-files-jobs.workspace = true
nova-files-look-api.workspace = true
nova-files-look-core.workspace = true
nova-files-look-ui.workspace = true
nova-files-messages.workspace = true
nova-files-open-api.workspace = true
nova-files-open-core.workspace = true
