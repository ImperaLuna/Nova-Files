# nova-files
#
# The program. Wiring only: it starts the core, the D-Bus service and the
# window, and holds no logic of its own.
#
# Allowed outside crates:
# - libc
#
# Allowed workspace crates:
# - nova-files-api
# - nova-files-core
# - nova-files-dbus
# - nova-files-index
# - nova-files-picker-api
# - nova-files-shell
# - nova-files-trash-ui
# - nova-files-ui

[package]
name = "nova-files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# malloc_trim, to give freed memory back after a listing (memory.rs).
libc = "0.2.189"
nova-files-api.workspace = true
nova-files-core.workspace = true
nova-files-dbus.workspace = true
nova-files-picker-api.workspace = true
nova-files-shell.workspace = true
nova-files-trash-ui.workspace = true
nova-files-ui.workspace = true

[dev-dependencies]
nova-files-settings-api.workspace = true
nova-files-trash-api.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# To call the running program over D-Bus, as a launcher would.
zbus = "5"
